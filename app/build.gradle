plugins {
    id 'com.android.application'
}

// Release signing is configured from a keystore.properties file (local) or
// environment variables (CI). If neither is present, the release build falls
// back to the debug signing config so local `assembleRelease` still works.
// NOTE: self-update only installs if the new APK is signed with the SAME key
// as the one already on the device. Keep the release keystore stable forever.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
def hasKeystoreFile = keystorePropsFile.exists()
if (hasKeystoreFile) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

def envStorePath = System.getenv("MOVY_KEYSTORE_PATH")
def hasReleaseSigning = hasKeystoreFile || (envStorePath != null && !envStorePath.isEmpty())

android {
    namespace 'sx.movy.tv'
    compileSdk 34

    defaultConfig {
        applicationId "sx.movy.tv"
        minSdk 21
        targetSdk 34
        versionCode 22
        versionName "1.21"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(hasKeystoreFile
                        ? keystoreProps.getProperty("storeFile")
                        : envStorePath)
                storePassword hasKeystoreFile
                        ? keystoreProps.getProperty("storePassword")
                        : System.getenv("MOVY_KEYSTORE_PASSWORD")
                keyAlias hasKeystoreFile
                        ? keystoreProps.getProperty("keyAlias")
                        : System.getenv("MOVY_KEY_ALIAS")
                keyPassword hasKeystoreFile
                        ? keystoreProps.getProperty("keyPassword")
                        : System.getenv("MOVY_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the release keystore when available, otherwise fall back to
            // the debug key so local release builds still succeed.
            signingConfig hasReleaseSigning
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    // 1.3.x supports the project's API 34 toolchain while retaining HLS,
    // track selection, subtitles, and the native TV playback controls.
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
}

// One source of provider/backend mappings for Android and Windows.
def sharedConfig = rootProject.file('shared/movy-config.json')
def generatedMovy = layout.buildDirectory.dir('generated/movy')
android.sourceSets.main.java.srcDir(generatedMovy)
android.sourceSets.main.assets.srcDir(rootProject.file('shared'))
android.sourceSets.main.assets.exclude('fixtures/**')
android.sourceSets.test.resources.srcDir(rootProject.file('shared/fixtures'))
def generateMovyConfig = tasks.register('generateMovyConfig') {
    inputs.file(sharedConfig)
    outputs.dir(generatedMovy)
    doLast {
        def config = new groovy.json.JsonSlurper().parse(sharedConfig)
        def quote = { value -> groovy.json.JsonOutput.toJson(value) }
        def rows = config.providers.collect { p ->
            "new CatalogClient.Provider(${quote(p.name)},${p.network},${p.watchId},${quote(p.logo)},0xff${p.color.substring(1)})"
        }.join(',\n        ')
        def target = generatedMovy.get().file('sx/movy/tv/MovyConfig.java').asFile
        target.parentFile.mkdirs()
        target.text = """package sx.movy.tv;
// Generated from shared/movy-config.json. Do not edit.
final class MovyConfig {
    static final String SITE=${quote(config.site)};
    static final String METADATA=${quote(config.metadata)};
    static final String ACCOUNT=${quote(config.account)};
    static final String SUBTITLES=${quote(config.subtitles)};
    static final CatalogClient.Provider[] PROVIDERS={${rows}};
}
"""
    }
}
tasks.named('preBuild').configure { dependsOn(generateMovyConfig) }
